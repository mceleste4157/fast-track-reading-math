name: Checks

# Runs on every pull request and on every branch push except main
# (main runs the same checks as the first step of the deploy workflow).
on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sanity checks (scripts/check.js)
        run: node scripts/check.js
