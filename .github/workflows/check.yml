name: Checks

# Runs on every pull request and on every branch push except main
# (main runs the same checks as the first job of the deploy workflow).
on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4   # the Firestore emulator needs Java
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Sanity checks (scripts/check.js)
        run: node scripts/check.js
      - name: Security rules tests (Firestore emulator)
        run: npx --yes firebase-tools@15.15.0 emulators:exec --only firestore --project demo-school-rules "node scripts/test-rules.js"
