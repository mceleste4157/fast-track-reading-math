<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentence Unscramble – FAST Track</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--purple:#7c3aed;--purple-soft:#ede9fe;--green:#10b981;--green-soft:#d1fae5;--red:#dc2626;--red-soft:#fee2e2;--bg:#f8f7ff;--surface:#fff;--border:#e5e7eb;--text:#111827;--muted:#6b7280;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .nav{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
    .nav-back{text-decoration:none;color:var(--purple);font-weight:600;font-size:.9rem;}
    .nav-title{font-weight:700;font-size:1rem;flex:1;text-align:center;}
    .nav-prog{font-size:.82rem;font-weight:700;color:var(--muted);}
    .page{max-width:500px;margin:0 auto;padding:24px 16px 80px;display:flex;flex-direction:column;align-items:center;gap:18px;}
    .prog-bar-wrap{width:100%;height:7px;background:var(--border);border-radius:99px;overflow:hidden;}
    .prog-bar-fill{height:100%;background:var(--purple);border-radius:99px;transition:width .4s;}
    .instruct{font-size:.82rem;color:var(--muted);font-weight:600;text-align:center;}
    /* Answer area */
    .answer-area{
      width:100%;min-height:72px;background:var(--surface);border:2.5px dashed var(--border);
      border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;
      align-content:flex-start;transition:border-color .2s;
    }
    .answer-area.correct{border-color:var(--green);background:var(--green-soft);}
    .answer-area.wrong{border-color:var(--red);background:var(--red-soft);}
    /* Word chips */
    .chip{
      padding:8px 14px;border-radius:99px;font-size:.92rem;font-weight:700;cursor:pointer;
      border:2px solid;transition:transform .1s,opacity .2s;user-select:none;
    }
    .chip:active{transform:scale(.95);}
    .chip-pool{background:var(--purple-soft);color:var(--purple);border-color:#c4b5fd;}
    .chip-answer{background:var(--purple);color:#fff;border-color:var(--purple);}
    .chip-pool.used{opacity:.3;pointer-events:none;}
    /* Word pool */
    .word-pool{width:100%;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
    .feedback{font-size:1rem;font-weight:700;min-height:1.4em;text-align:center;}
    .feedback.correct{color:var(--green);}
    .feedback.wrong{color:var(--red);}
    .correct-answer{font-size:.85rem;color:var(--muted);font-weight:600;text-align:center;font-style:italic;}
    .btn-check{width:100%;padding:15px;background:var(--purple);color:#fff;border:none;border-radius:14px;font-size:1.05rem;font-weight:800;cursor:pointer;font-family:inherit;}
    .btn-check:disabled{opacity:.4;cursor:default;}
    .btn-clear{width:100%;padding:11px;background:var(--surface);color:var(--muted);border:1.5px solid var(--border);border-radius:12px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;}
    /* Results */
    .results-screen{width:100%;text-align:center;display:none;flex-direction:column;align-items:center;gap:16px;}
    .result-emoji{font-size:4rem;}
    .result-title{font-size:1.5rem;font-weight:900;}
    .result-sub{font-size:.92rem;color:var(--muted);font-weight:600;}
    .xp-pill{display:inline-flex;align-items:center;gap:6px;background:var(--purple-soft);color:var(--purple);font-size:.9rem;font-weight:800;padding:8px 18px;border-radius:99px;}
    .btn-row{display:flex;gap:12px;width:100%;}
    .btn-primary{flex:1;padding:14px;background:var(--purple);color:#fff;border:none;border-radius:14px;font-size:.95rem;font-weight:800;cursor:pointer;font-family:inherit;text-decoration:none;text-align:center;}
    .btn-secondary{flex:1;padding:14px;background:var(--surface);color:var(--purple);border:2px solid var(--purple);border-radius:14px;font-size:.95rem;font-weight:800;cursor:pointer;font-family:inherit;}
  </style>
  <link rel="stylesheet" href="dark.css" />
</head>
<body>
  <nav class="nav">
    <a class="nav-back" id="nav-back" href="library.html">← Back</a>
    <span class="nav-title">🔀 Sentence Unscramble</span>
    <span class="nav-prog" id="nav-prog"></span>
  </nav>
  <div class="page" id="quiz-screen">
    <div class="prog-bar-wrap"><div class="prog-bar-fill" id="prog-bar" style="width:0%"></div></div>
    <div class="instruct">Tap words to build the sentence in the right order</div>
    <div class="answer-area" id="answer-area"></div>
    <div class="feedback" id="feedback"></div>
    <div class="correct-answer" id="correct-answer"></div>
    <div class="word-pool" id="word-pool"></div>
    <button class="btn-clear" id="btn-clear" onclick="clearAnswer()">Clear</button>
    <button class="btn-check" id="btn-check" disabled>Check ✓</button>
  </div>
  <div class="page results-screen" id="results-screen">
    <div class="result-emoji" id="result-emoji"></div>
    <div class="result-title" id="result-title"></div>
    <div class="result-sub"  id="result-sub"></div>
    <div class="xp-pill" id="xp-pill" style="display:none"></div>
    <div class="btn-row">
      <a class="btn-primary" href="library.html">📚 Library</a>
      <button class="btn-secondary" onclick="startQuiz()">🔄 Try Again</button>
    </div>
  </div>
  <script src="stories.js?v=20260705"></script>
  <script src="/__/firebase/10.0.0/firebase-app-compat.js"></script>
  <script src="/__/firebase/10.0.0/firebase-firestore-compat.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script>
    const profile = (() => { try { return JSON.parse(localStorage.getItem('readerProfile')); } catch(e) { return null; } })();
    if (!profile) window.location.href = 'login.html';
    const params  = new URLSearchParams(location.search);
    const storyId = params.get('story');
    const story   = storyId ? STORIES.find(s => s.id === storyId) : null;
    if (!story) window.location.href = 'library.html';
    document.getElementById('nav-back').href = storyId ? 'results.html' : 'library.html';

    function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
    function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

    // Extract suitable sentences from story text
    function getSentences() {
      const raw = story.text.split(/(?<=[.!?])\s+/).map(s=>s.trim())
        .filter(s=>{const words=s.split(/\s+/);return words.length>=5&&words.length<=14&&s.length>25;});
      return shuffle(raw).slice(0,5);
    }

    let sentences=[], idx=0, correctCount=0;
    let currentWords=[], pickedIndices=[];

    function startQuiz(){
      sentences=getSentences();
      if(!sentences.length){window.location.href='library.html';return;}
      idx=0;correctCount=0;
      document.getElementById('results-screen').style.display='none';
      document.getElementById('quiz-screen').style.display='flex';
      showSentence();
    }

    function showSentence(){
      const sentence=sentences[idx];
      // Remove punctuation from end for cleaner display, keep words
      const words=sentence.replace(/[.!?]+$/,'').split(/\s+/);
      currentWords=shuffle(words.map((w,i)=>({w,origIdx:i})));
      pickedIndices=[];

      document.getElementById('nav-prog').textContent=(idx+1)+' / '+sentences.length;
      document.getElementById('prog-bar').style.width=(idx/sentences.length*100)+'%';
      document.getElementById('feedback').textContent='';
      document.getElementById('feedback').className='feedback';
      document.getElementById('correct-answer').textContent='';
      document.getElementById('answer-area').className='answer-area';
      document.getElementById('btn-check').disabled=true;
      document.getElementById('btn-check').textContent='Check ✓';
      document.getElementById('btn-check').onclick=checkAnswer;

      renderPool();
      renderAnswer();
    }

    function renderPool(){
      const pool=document.getElementById('word-pool');
      pool.innerHTML=currentWords.map((item,i)=>`
        <span class="chip chip-pool${pickedIndices.includes(i)?' used':''}" data-i="${i}" onclick="pickWord(${i})">${escHtml(item.w)}</span>
      `).join('');
    }

    function renderAnswer(){
      const area=document.getElementById('answer-area');
      if(!pickedIndices.length){area.innerHTML='<span style="color:var(--muted);font-size:.85rem;font-weight:500;">Tap words below to build the sentence…</span>';return;}
      area.innerHTML=pickedIndices.map((pi,pos)=>`
        <span class="chip chip-answer" data-pos="${pos}" onclick="removeWord(${pos})">${escHtml(currentWords[pi].w)}</span>
      `).join('');
      document.getElementById('btn-check').disabled=pickedIndices.length<currentWords.length;
    }

    function pickWord(i){
      if(pickedIndices.includes(i)) return;
      pickedIndices.push(i);
      renderPool(); renderAnswer();
    }
    function removeWord(pos){
      pickedIndices.splice(pos,1);
      renderPool(); renderAnswer();
    }
    function clearAnswer(){
      pickedIndices=[];
      renderPool(); renderAnswer();
    }

    function checkAnswer(){
      const sentence=sentences[idx];
      const correct_words=sentence.replace(/[.!?]+$/,'').split(/\s+/);
      const user_words=pickedIndices.map(pi=>currentWords[pi].w);
      const correct=user_words.join(' ').toLowerCase()===correct_words.join(' ').toLowerCase();
      if(correct) correctCount++;

      document.getElementById('answer-area').className='answer-area '+(correct?'correct':'wrong');
      const fb=document.getElementById('feedback');
      fb.className='feedback '+(correct?'correct':'wrong');
      fb.textContent=correct?'✅ Correct!':'❌ Not quite!';
      if(!correct) document.getElementById('correct-answer').textContent='Correct: '+correct_words.join(' ');

      const btn=document.getElementById('btn-check');
      btn.textContent=idx<sentences.length-1?'Next →':'See Results';
      btn.onclick=nextSentence;
    }

    function nextSentence(){
      idx++;
      if(idx<sentences.length) showSentence();
      else showResults();
    }

    function showResults(){
      document.getElementById('quiz-screen').style.display='none';
      document.getElementById('results-screen').style.display='flex';
      const total=sentences.length;
      const bonusXp=correctCount*15;
      const pct=correctCount/total;
      let emoji='😢',title='Keep practicing!';
      if(pct===1){emoji='🏆';title='Perfect!';}
      else if(pct>=.8){emoji='🌟';title='Great job!';}
      else if(pct>=.6){emoji='👍';title='Nice work!';}
      document.getElementById('result-emoji').textContent=emoji;
      document.getElementById('result-title').textContent=title;
      document.getElementById('result-sub').textContent=correctCount+' of '+total+' correct';
      if(bonusXp>0){const p=document.getElementById('xp-pill');p.textContent='⚡ +'+bonusXp+' XP!';p.style.display='';}
      if(bonusXp>0) firebase.firestore().collection('StudentStats').doc(profile.readerId)
        .set({challengeXp:firebase.firestore.FieldValue.increment(bonusXp),lastUpdated:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(()=>{});
    }

    startQuiz();
  </script>
</body>
</html>
