<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spelling Quiz – FAST Track Reading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple: #7c3aed; --purple-soft: #ede9fe;
      --green:  #10b981; --green-soft:  #d1fae5;
      --red:    #dc2626; --red-soft:    #fee2e2;
      --orange: #f59e0b;
      --blue:   #2563eb;
      --bg: #f8f7ff; --surface: #ffffff;
      --border: #e5e7eb; --text: #111827; --muted: #6b7280;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .nav {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 14px 20px; display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 10;
    }
    .nav-back { text-decoration: none; color: var(--purple); font-weight: 600; font-size: 0.9rem; }
    .nav-title { font-weight: 700; font-size: 1rem; flex: 1; text-align: center; }
    .nav-progress { font-size: 0.82rem; font-weight: 700; color: var(--muted); }

    .page { max-width: 480px; margin: 0 auto; padding: 32px 16px 80px; display: flex; flex-direction: column; align-items: center; gap: 20px; }

    /* progress bar */
    .prog-bar-wrap { width: 100%; height: 7px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .prog-bar-fill { height: 100%; background: var(--purple); border-radius: 99px; transition: width 0.4s; }

    /* word card */
    .word-card {
      width: 100%; background: var(--surface); border: 2px solid var(--border);
      border-radius: 20px; padding: 28px 24px; text-align: center;
    }
    .wc-def-label { font-size: 0.7rem; font-weight: 800; color: var(--purple); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }
    .wc-definition { font-size: 1.05rem; font-weight: 600; color: var(--text); line-height: 1.5; margin-bottom: 22px; }
    .wc-hint { font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
    .wc-blanks { font-size: 1.6rem; font-weight: 900; letter-spacing: 0.18em; color: var(--purple); font-family: monospace; margin-bottom: 22px; }

    .spell-input {
      width: 100%; padding: 14px 18px; font-size: 1.1rem; font-family: inherit;
      font-weight: 700; text-align: center; letter-spacing: 0.05em;
      border: 2.5px solid var(--border); border-radius: 12px; outline: none;
      background: var(--surface); color: var(--text); transition: border-color 0.2s;
    }
    .spell-input:focus { border-color: var(--purple); }
    .spell-input.correct { border-color: var(--green); background: var(--green-soft); }
    .spell-input.wrong   { border-color: var(--red);   background: var(--red-soft);   }

    .feedback {
      font-size: 1rem; font-weight: 700; min-height: 1.4em; text-align: center;
      transition: opacity 0.2s;
    }
    .feedback.correct { color: var(--green); }
    .feedback.wrong   { color: var(--red);   }

    .btn-submit {
      width: 100%; padding: 15px; background: var(--purple); color: #fff;
      border: none; border-radius: 14px; font-size: 1.05rem; font-weight: 800;
      cursor: pointer; font-family: inherit; transition: background 0.15s, transform 0.1s;
    }
    .btn-submit:hover { background: #6d28d9; }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { background: var(--border); color: var(--muted); cursor: default; }

    /* results screen */
    .results-screen { width: 100%; text-align: center; display: none; flex-direction: column; align-items: center; gap: 18px; }
    .result-emoji  { font-size: 4rem; }
    .result-title  { font-size: 1.6rem; font-weight: 900; }
    .result-score  { font-size: 1rem; color: var(--muted); font-weight: 600; }
    .xp-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--purple-soft); color: var(--purple);
      font-size: 0.9rem; font-weight: 800; padding: 8px 18px; border-radius: 99px;
    }
    .word-review { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .review-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 12px; padding: 11px 14px;
    }
    .review-row.correct { border-color: var(--green); background: var(--green-soft); }
    .review-row.wrong   { border-color: var(--red);   background: var(--red-soft);   }
    .review-icon { font-size: 1.1rem; flex-shrink: 0; }
    .review-word { font-weight: 700; font-size: 0.95rem; flex: 1; }
    .review-typed { font-size: 0.78rem; color: var(--muted); }

    .btn-row { display: flex; gap: 12px; width: 100%; flex-wrap: wrap; }
    .btn-primary {
      flex: 1; padding: 14px; background: var(--purple); color: #fff;
      border: none; border-radius: 14px; font-size: 0.95rem; font-weight: 800;
      cursor: pointer; font-family: inherit; text-decoration: none; text-align: center;
    }
    .btn-secondary {
      flex: 1; padding: 14px; background: var(--surface); color: var(--purple);
      border: 2px solid var(--purple); border-radius: 14px; font-size: 0.95rem; font-weight: 800;
      cursor: pointer; font-family: inherit; text-decoration: none; text-align: center;
    }
  </style>
  <link rel="stylesheet" href="dark.css" />
</head>
<body>
  <nav class="nav">
    <a class="nav-back" id="nav-back" href="library.html">← Back</a>
    <span class="nav-title">🔤 Spelling Quiz</span>
    <span class="nav-progress" id="nav-progress"></span>
  </nav>

  <div class="page" id="quiz-screen">
    <div class="prog-bar-wrap"><div class="prog-bar-fill" id="prog-bar" style="width:0%"></div></div>

    <div class="word-card">
      <div class="wc-def-label">What word means…</div>
      <div class="wc-definition" id="wc-definition"></div>
      <div class="wc-hint" id="wc-hint"></div>
      <div class="wc-blanks" id="wc-blanks"></div>
      <input class="spell-input" id="spell-input" type="text" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" placeholder="Type the word…" />
    </div>

    <div class="feedback" id="feedback"></div>
    <button class="btn-submit" id="btn-submit">Check ✓</button>
  </div>

  <div class="page results-screen" id="results-screen">
    <div class="result-emoji" id="result-emoji"></div>
    <div class="result-title" id="result-title"></div>
    <div class="result-score" id="result-score"></div>
    <div class="xp-pill" id="xp-pill" style="display:none;"></div>
    <div class="word-review" id="word-review"></div>
    <div class="btn-row">
      <a class="btn-primary" id="btn-library" href="library.html">📚 Library</a>
      <button class="btn-secondary" id="btn-retry" onclick="startQuiz()">🔄 Try Again</button>
    </div>
  </div>

  <script src="stories.js?v=20260705"></script>
  <script src="/__/firebase/10.0.0/firebase-app-compat.js"></script>
  <script src="/__/firebase/10.0.0/firebase-firestore-compat.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script>
    const profile = (() => { try { return JSON.parse(localStorage.getItem('readerProfile')); } catch(e) { return null; } })();
    if (!profile) window.location.href = 'login.html';

    const params  = new URLSearchParams(location.search);
    const storyId = params.get('story');
    const story   = storyId ? STORIES.find(s => s.id === storyId) : null;
    if (!story || !Array.isArray(story.vocabulary) || story.vocabulary.length < 3) {
      window.location.href = 'library.html';
    }

    document.getElementById('nav-back').href = storyId ? 'results.html' : 'library.html';

    const MAX_WORDS = 5;
    const XP_PER_WORD = 15;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function makeBlanks(word) {
      if (word.length <= 3) return word[0] + '_'.repeat(word.length - 1);
      return word[0] + '_'.repeat(word.length - 2) + word[word.length - 1];
    }

    let words = [];       // { word, definition } objects for this round
    let idx   = 0;        // current question index
    let answers = [];     // { word, typed, correct }

    function startQuiz() {
      const pool = shuffle(story.vocabulary.map(v =>
        typeof v === 'string' ? { word: v, definition: '' } : v
      )).slice(0, MAX_WORDS);
      words   = pool;
      idx     = 0;
      answers = [];
      document.getElementById('results-screen').style.display = 'none';
      document.getElementById('quiz-screen').style.display    = 'flex';
      showWord();
    }

    function showWord() {
      const w = words[idx];
      const total = words.length;
      document.getElementById('nav-progress').textContent = (idx + 1) + ' / ' + total;
      document.getElementById('prog-bar').style.width = ((idx / total) * 100) + '%';
      document.getElementById('wc-definition').textContent = w.definition || '(no definition — use context clues!)';
      document.getElementById('wc-hint').textContent = w.word.length + ' letters';
      document.getElementById('wc-blanks').textContent = makeBlanks(w.word);
      const inp = document.getElementById('spell-input');
      inp.value = '';
      inp.className = 'spell-input';
      inp.disabled = false;
      inp.focus();
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('btn-submit').disabled = false;
      document.getElementById('btn-submit').textContent = 'Check ✓';
    }

    function checkAnswer() {
      const w = words[idx];
      const inp = document.getElementById('spell-input');
      const typed = inp.value.trim();
      if (!typed) return;

      const correct = typed.toLowerCase() === w.word.toLowerCase();
      answers.push({ word: w.word, typed, correct });

      inp.disabled = true;
      inp.className = 'spell-input ' + (correct ? 'correct' : 'wrong');
      const fb = document.getElementById('feedback');
      fb.className = 'feedback ' + (correct ? 'correct' : 'wrong');
      fb.textContent = correct
        ? '✅ Correct!'
        : '❌ The word is: ' + w.word;

      document.getElementById('btn-submit').textContent = idx < words.length - 1 ? 'Next →' : 'See Results';
      document.getElementById('btn-submit').disabled = false;
      document.getElementById('btn-submit').onclick = nextWord;
    }

    function nextWord() {
      document.getElementById('btn-submit').onclick = checkAnswer;
      idx++;
      if (idx < words.length) {
        showWord();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz-screen').style.display    = 'none';
      document.getElementById('results-screen').style.display = 'flex';
      document.getElementById('prog-bar').style.width = '100%';

      const correct = answers.filter(a => a.correct).length;
      const total   = answers.length;
      const bonusXp = correct * XP_PER_WORD;
      const pct     = correct / total;

      let emoji = '😢', title = 'Keep practicing!';
      if (pct === 1)        { emoji = '🏆'; title = 'Perfect Speller!'; }
      else if (pct >= 0.8)  { emoji = '🌟'; title = 'Great job!'; }
      else if (pct >= 0.6)  { emoji = '👍'; title = 'Nice work!'; }
      else if (pct >= 0.4)  { emoji = '📚'; title = 'Keep studying!'; }

      document.getElementById('result-emoji').textContent = emoji;
      document.getElementById('result-title').textContent = title;
      document.getElementById('result-score').textContent = correct + ' out of ' + total + ' correct';

      const xpPill = document.getElementById('xp-pill');
      if (bonusXp > 0) {
        xpPill.textContent = '⚡ +' + bonusXp + ' XP earned!';
        xpPill.style.display = '';
      }

      // Word review
      document.getElementById('word-review').innerHTML = answers.map(a => `
        <div class="review-row ${a.correct ? 'correct' : 'wrong'}">
          <span class="review-icon">${a.correct ? '✅' : '❌'}</span>
          <span class="review-word">${escHtml(a.word)}</span>
          ${!a.correct ? `<span class="review-typed">you wrote: ${escHtml(a.typed)}</span>` : ''}
        </div>`).join('');

      // Save XP to Firestore
      if (bonusXp > 0) {
        firebase.firestore().collection('StudentStats').doc(profile.readerId)
          .set({
            challengeXp: firebase.firestore.FieldValue.increment(bonusXp),
            lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true }).catch(() => {});
        firebase.firestore().collection('SpellingProgress').add({
          readerId:   profile.readerId,
          readerName: profile.name,
          storyId:    story.id,
          storyTitle: story.title,
          correct, total,
          xpEarned:   bonusXp,
          date:       new Date().toISOString().slice(0, 10),
          timestamp:  firebase.firestore.FieldValue.serverTimestamp()
        }).catch(() => {});
      }
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('btn-submit').addEventListener('click', checkAnswer);
    document.getElementById('spell-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btn-submit').click();
    });

    startQuiz();
  </script>
</body>
</html>
