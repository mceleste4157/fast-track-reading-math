<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcards – FAST Track</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple:#7c3aed;--purple-soft:#ede9fe;
      --green:#10b981;--green-soft:#d1fae5;
      --orange:#f59e0b;--red:#dc2626;
      --bg:#f8f7ff;--surface:#fff;--border:#e5e7eb;--text:#111827;--muted:#6b7280;
      --radius:14px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .nav{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
    .nav-back{text-decoration:none;color:var(--purple);font-weight:600;font-size:.9rem;}
    .nav-title{font-weight:700;font-size:1rem;flex:1;text-align:center;}
    .nav-prog{font-size:.82rem;font-weight:700;color:var(--muted);}
    .page{max-width:480px;margin:0 auto;padding:28px 16px 80px;display:flex;flex-direction:column;align-items:center;gap:20px;}
    .prog-bar-wrap{width:100%;height:7px;background:var(--border);border-radius:99px;overflow:hidden;}
    .prog-bar-fill{height:100%;background:var(--purple);border-radius:99px;transition:width .4s;}
    /* Card flip */
    .scene{width:100%;max-width:420px;height:240px;perspective:1000px;cursor:pointer;}
    .card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);}
    .card.flipped{transform:rotateY(180deg);}
    .card-face{
      position:absolute;inset:0;border-radius:20px;display:flex;flex-direction:column;
      align-items:center;justify-content:center;padding:24px;text-align:center;
      backface-visibility:hidden;-webkit-backface-visibility:hidden;
    }
    .card-front{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;box-shadow:0 8px 32px rgba(124,58,237,.35);}
    .card-back{background:linear-gradient(135deg,#059669,#10b981);color:#fff;transform:rotateY(180deg);box-shadow:0 8px 32px rgba(16,185,129,.35);}
    .card-label{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.8;margin-bottom:12px;}
    .card-word{font-size:1.9rem;font-weight:900;line-height:1.1;}
    .card-def{font-size:1rem;font-weight:600;line-height:1.5;}
    .tap-hint{font-size:.78rem;color:var(--muted);font-weight:600;margin-top:6px;}
    .btn-row{display:flex;gap:12px;width:100%;}
    .btn-got{flex:1;padding:14px;background:var(--green);color:#fff;border:none;border-radius:14px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;transition:opacity .15s;}
    .btn-study{flex:1;padding:14px;background:var(--surface);color:var(--purple);border:2px solid var(--purple);border-radius:14px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;}
    .btn-got:disabled,.btn-study:disabled{opacity:.35;cursor:default;}
    .pile-info{font-size:.82rem;color:var(--muted);font-weight:600;text-align:center;}
    /* Results */
    .results-screen{width:100%;text-align:center;display:none;flex-direction:column;align-items:center;gap:16px;}
    .result-emoji{font-size:4rem;}
    .result-title{font-size:1.5rem;font-weight:900;}
    .result-sub{font-size:.92rem;color:var(--muted);font-weight:600;}
    .xp-pill{display:inline-flex;align-items:center;gap:6px;background:var(--purple-soft);color:var(--purple);font-size:.9rem;font-weight:800;padding:8px 18px;border-radius:99px;}
    .btn-primary{width:100%;padding:14px;background:var(--purple);color:#fff;border:none;border-radius:14px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;text-decoration:none;display:block;text-align:center;}
    .btn-secondary{width:100%;padding:14px;background:var(--surface);color:var(--purple);border:2px solid var(--purple);border-radius:14px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;}
  </style>
  <link rel="stylesheet" href="dark.css" />
</head>
<body>
  <nav class="nav">
    <a class="nav-back" id="nav-back" href="library.html">← Back</a>
    <span class="nav-title">🃏 Flashcards</span>
    <span class="nav-prog" id="nav-prog"></span>
  </nav>
  <div class="page" id="quiz-screen">
    <div class="prog-bar-wrap"><div class="prog-bar-fill" id="prog-bar" style="width:0%"></div></div>
    <div class="scene" id="scene" onclick="flipCard()">
      <div class="card" id="card">
        <div class="card-face card-front">
          <div class="card-label">Word</div>
          <div class="card-word" id="card-word"></div>
        </div>
        <div class="card-face card-back">
          <div class="card-label">Definition</div>
          <div class="card-def" id="card-def"></div>
        </div>
      </div>
    </div>
    <div class="tap-hint" id="tap-hint">Tap the card to see the definition</div>
    <div class="btn-row">
      <button class="btn-study" id="btn-study" onclick="answer(false)" disabled>🔄 Study More</button>
      <button class="btn-got"  id="btn-got"  onclick="answer(true)"  disabled>✓ Got It!</button>
    </div>
    <div class="pile-info" id="pile-info"></div>
  </div>
  <div class="page results-screen" id="results-screen">
    <div class="result-emoji" id="result-emoji"></div>
    <div class="result-title" id="result-title"></div>
    <div class="result-sub"  id="result-sub"></div>
    <div class="xp-pill" id="xp-pill" style="display:none"></div>
    <button class="btn-secondary" onclick="restart()">🔄 Study Again</button>
    <a class="btn-primary" id="btn-back" href="library.html">📚 Back to Library</a>
  </div>
  <script src="stories.js?v=20260705"></script>
  <script src="/__/firebase/10.0.0/firebase-app-compat.js"></script>
  <script src="/__/firebase/10.0.0/firebase-firestore-compat.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script>
    const profile = (() => { try { return JSON.parse(localStorage.getItem('readerProfile')); } catch(e) { return null; } })();
    if (!profile) window.location.href = 'login.html';
    const params  = new URLSearchParams(location.search);
    const storyId = params.get('story');
    const story   = storyId ? STORIES.find(s => s.id === storyId) : null;
    if (!story || !Array.isArray(story.vocabulary) || !story.vocabulary.length) window.location.href = 'library.html';
    document.getElementById('nav-back').href = storyId ? 'results.html' : 'library.html';
    document.getElementById('btn-back').href = 'library.html';

    function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

    let deck = [], studyPile = [], gotPile = [], flipped = false;

    function restart() {
      deck = shuffle(story.vocabulary.map(v => typeof v === 'string' ? {word:v,definition:''} : v));
      studyPile = [...deck]; gotPile = [];
      document.getElementById('results-screen').style.display = 'none';
      document.getElementById('quiz-screen').style.display    = 'flex';
      showCard();
    }

    function showCard() {
      const w = studyPile[0];
      const total = deck.length;
      const doneCount = gotPile.length;
      document.getElementById('nav-prog').textContent   = doneCount + ' / ' + total;
      document.getElementById('prog-bar').style.width   = (doneCount / total * 100) + '%';
      document.getElementById('card-word').textContent  = w.word;
      document.getElementById('card-def').textContent   = w.definition || '(tap to reveal)';
      document.getElementById('pile-info').textContent  = studyPile.length + ' card' + (studyPile.length !== 1 ? 's' : '') + ' left · ' + gotPile.length + ' mastered';
      const card = document.getElementById('card');
      card.classList.remove('flipped');
      flipped = false;
      document.getElementById('btn-got').disabled   = true;
      document.getElementById('btn-study').disabled = true;
      document.getElementById('tap-hint').textContent = 'Tap the card to see the definition';
    }

    function flipCard() {
      const card = document.getElementById('card');
      flipped = !flipped;
      card.classList.toggle('flipped', flipped);
      if (flipped) {
        document.getElementById('btn-got').disabled   = false;
        document.getElementById('btn-study').disabled = false;
        document.getElementById('tap-hint').textContent = 'Did you know it?';
      }
    }

    function answer(knew) {
      const w = studyPile.shift();
      if (knew) {
        gotPile.push(w);
      } else {
        studyPile.push(w); // move to end of study pile
      }
      if (!studyPile.length) {
        showResults();
      } else {
        showCard();
      }
    }

    function showResults() {
      document.getElementById('quiz-screen').style.display    = 'none';
      document.getElementById('results-screen').style.display = 'flex';
      document.getElementById('prog-bar').style.width = '100%';
      const total = deck.length;
      const xp = 10 * total;
      let emoji = '🌟', title = 'All mastered!', sub = 'You knew all ' + total + ' words!';
      document.getElementById('result-emoji').textContent = emoji;
      document.getElementById('result-title').textContent = title;
      document.getElementById('result-sub').textContent   = sub;
      const pill = document.getElementById('xp-pill');
      pill.textContent = '⚡ +' + xp + ' XP earned!'; pill.style.display = '';
      firebase.firestore().collection('StudentStats').doc(profile.readerId)
        .set({challengeXp:firebase.firestore.FieldValue.increment(xp),lastUpdated:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(()=>{});
    }

    restart();
  </script>
</body>
</html>
