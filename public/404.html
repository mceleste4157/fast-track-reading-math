<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — FAST Track</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f9fafb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 48px 36px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .emoji { font-size: 4rem; margin-bottom: 16px; }
    h1 { font-size: 1.4rem; font-weight: 800; color: #111; margin-bottom: 8px; }
    p  { font-size: 0.95rem; color: #6b7280; margin-bottom: 28px; line-height: 1.5; }
    a  {
      display: inline-block;
      background: #7c3aed;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 12px;
    }
    a:hover { background: #6d28d9; }
  </style>
  <link rel="stylesheet" href="dark.css" />
</head>
<body>
  <div class="card">
    <div class="emoji">🔍</div>
    <h1>Page Not Found</h1>
    <p>Looks like this page doesn't exist. Head back home and keep reading!</p>
    <a href="/index.html">Go Home</a>
  </div>
</body>
</html>
