<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Zone – FAST Track Reading & Math</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #2563eb; --blue-soft: #dbeafe;
      --purple: #7c3aed; --purple-soft: #ede9fe;
      --orange: #f59e0b;
      --green: #10b981; --green-soft: #d1fae5;
      --bg: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
      --surface: #ffffff; --border: rgba(0,0,0,0.08);
      --text: #1e1b4b; --muted: #6b7280; --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* NAV */
    .nav {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 14px 20px; display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 10;
    }
    .nav-back { text-decoration: none; color: var(--blue); font-weight: 700; font-size: 0.95rem; }
    .nav-back:hover { text-decoration: underline; }
    .nav-title { font-size: 1.1rem; font-weight: 800; flex: 1; text-align: center; }
    .nav-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.9rem; color: #fff; flex-shrink: 0;
    }

    .page { max-width: 960px; margin: 0 auto; padding: 32px 16px 60px; }

    /* LOCKED STATE */
    .locked-card {
      background: var(--surface); border-radius: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 48px 32px; text-align: center; max-width: 520px; margin: 0 auto;
    }
    .lock-icon { font-size: 5rem; margin-bottom: 20px; }
    .locked-title { font-size: 1.7rem; font-weight: 800; margin-bottom: 12px; }
    .locked-desc { font-size: 1.05rem; color: var(--muted); line-height: 1.6; margin-bottom: 28px; }
    .locked-req {
      background: var(--orange); color: #fff;
      border-radius: 12px; padding: 16px 20px;
      font-size: 1rem; font-weight: 700; margin-bottom: 28px;
    }
    .best-score-wrap { margin-bottom: 28px; }
    .best-score-label { font-size: 0.9rem; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
    .best-score-bar-wrap { height: 12px; background: #e5e7eb; border-radius: 99px; overflow: hidden; }
    .best-score-bar { height: 100%; background: var(--orange); border-radius: 99px; transition: width 0.6s ease; }
    .best-score-stars { margin-top: 8px; font-size: 1.2rem; }

    .btn-library {
      display: inline-block; padding: 13px 28px;
      background: var(--blue); color: #fff; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 700; text-decoration: none; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-library:hover { background: #1d4ed8; }

    /* UNLOCKED STATE */
    .unlocked-header {
      text-align: center; margin-bottom: 36px;
    }
    .unlocked-header h1 { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
    .unlocked-header p { color: var(--muted); font-size: 1.05rem; }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .topic-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .topic-pill {
      font-family: inherit; font-size: 0.85rem; font-weight: 700; text-transform: capitalize;
      padding: 7px 14px; border-radius: 99px; cursor: pointer;
      border: 2px solid var(--blue-soft); background: var(--surface); color: var(--blue);
      transition: background 0.15s, color 0.15s;
    }
    .topic-pill:hover { background: var(--blue-soft); }
    .topic-pill.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .topic-card {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: 0 2px 12px rgba(37,99,235,0.10);
      overflow: hidden; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex; flex-direction: column;
      text-decoration: none; color: inherit;
    }
    .topic-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(37,99,235,0.18); }
    .topic-cover {
      height: 110px; display: flex; align-items: center;
      justify-content: center; font-size: 3.5rem;
    }
    .topic-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .topic-label {
      display: inline-block; font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      padding: 3px 10px; border-radius: 99px; margin-bottom: 8px;
      background: var(--blue-soft); color: var(--blue);
    }
    .topic-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
    .topic-meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 14px; }
    .topic-stars { color: var(--orange); font-size: 0.95rem; margin-bottom: 8px; }
    .btn-start {
      display: block; width: 100%; padding: 10px;
      border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 700; cursor: pointer;
      text-align: center; transition: background 0.15s;
      background: var(--blue); color: #fff;
    }
    .btn-start:hover { background: #1d4ed8; }
    .btn-done { background: var(--green-soft); color: #065f46; }
    .btn-done:hover { background: #a7f3d0; }

    /* GUIDED PATH */
    .up-next {
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); color: #fff;
      border-radius: 20px; padding: 22px 22px 20px; margin-bottom: 22px;
      box-shadow: 0 8px 28px rgba(37,99,235,0.28);
    }
    .up-label { font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.9; margin-bottom: 12px; }
    .up-main { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
    .up-emoji { width: 72px; height: 72px; border-radius: 18px; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; font-size: 2.4rem; flex-shrink: 0; }
    .up-title { font-size: 1.35rem; font-weight: 800; line-height: 1.25; }
    .up-meta  { font-size: 0.88rem; opacity: 0.92; margin-top: 4px; }
    .up-btn {
      display: inline-block; background: #fff; color: #2563eb; text-decoration: none;
      font-weight: 800; font-size: 1.05rem; padding: 12px 26px; border-radius: 12px;
    }
    .up-btn:hover { background: #eff6ff; }
    .up-done { background: var(--green-soft); color: #065f46; border-radius: 16px; padding: 18px 20px; margin-bottom: 22px; font-weight: 700; text-align: center; }
    .path-section { margin-bottom: 22px; }
    .path-head { font-size: 0.82rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .path-row {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 8px;
      background: var(--surface); border-radius: 12px; text-decoration: none; color: inherit;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06); border: 2px solid transparent;
    }
    .path-row:hover { border-color: var(--blue-soft); }
    .path-row.next { border-color: var(--blue); }
    .path-emoji { font-size: 1.5rem; width: 36px; text-align: center; flex-shrink: 0; }
    .path-title { font-weight: 700; font-size: 0.98rem; flex: 1; min-width: 0; }
    .path-chip { font-size: 0.78rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: #f3f4f6; color: var(--muted); white-space: nowrap; }
    .path-chip.done { background: var(--green-soft); color: #065f46; }
    .path-chip.some { background: #fef3c7; color: #92400e; }
    .browse-toggle {
      display: block; width: 100%; margin: 6px 0 18px; padding: 13px; border-radius: 12px; cursor: pointer;
      font-family: inherit; font-size: 0.95rem; font-weight: 700; color: var(--blue);
      background: var(--surface); border: 2px dashed var(--blue-soft);
    }
    .browse-toggle:hover { background: var(--blue-soft); }

    /* XP display */
    .total-xp-bar {
      background: var(--surface); border-radius: 12px;
      padding: 16px 20px; margin-bottom: 28px;
      display: flex; align-items: center; gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .total-xp-num { font-size: 1.6rem; font-weight: 800; color: var(--blue); }
    .total-xp-label { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
  </style>
  <link rel="stylesheet" href="dark.css" />
</head>
<body>
  <nav class="nav">
    <a href="library.html" class="nav-back">← Library</a>
    <div class="nav-title">📐 Math Zone</div>
    <div class="nav-avatar" id="nav-avatar"></div>
  </nav>

  <div class="page" id="page-content">
    <div style="text-align:center;padding:60px;color:var(--muted);">Loading…</div>
  </div>

  <script src="math-data.js"></script>
  <script src="math-topics.js"></script>
  <script src="division-engine.js"></script>
  <script src="math-practice.js"></script>
  <script src="/__/firebase/10.0.0/firebase-app-compat.js"></script>
  <script src="/__/firebase/10.0.0/firebase-auth-compat.js"></script>
  <script src="/__/firebase/10.0.0/firebase-firestore-compat.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script src="auth-guard.js"></script>
  <script>
    const profile = (() => { try { return JSON.parse(localStorage.getItem('readerProfile')); } catch(e) { return null; } })();
    if (!profile) { window.location.href = 'login.html'; }

    const av = document.getElementById('nav-avatar');
    av.style.background = profile.avatarColor || '#2563eb';
    if (profile.avatarEmoji) {
      av.textContent = profile.avatarEmoji;
    } else {
      av.textContent = (profile.name || '?').trim().charAt(0).toUpperCase();
    }

    // Grade-filtered math sets
    const grade = parseInt(profile.gradeLevel) || 4;
    const GRADE_MATH_SETS = MATH_SETS.filter(s =>
      Array.isArray(s.grades) && s.grades.includes(grade)
    );

    const MATH_UNLOCK_KEY   = 'mathUnlocked_' + profile.readerId;
    // Settings from parent portal, cached at last login (fall back to safe defaults if not set).
    // Refetched fresh from Firestore below since a parent may have changed these since the
    // student's last login and this cached copy would otherwise silently gate on stale values.
    let MATH_UNLOCK_SCORE  = profile.mathUnlockScore  ?? 3;  // 0 = always unlocked
    let READ_REQUIRED_MINS = profile.dailyReadMinutes ?? 30; // 0 = no requirement
    let MATH_LIMIT_MINS    = profile.dailyMathMinutes ?? 10; // 0 = no limit

    let READ_REQUIRED_SECS = READ_REQUIRED_MINS * 60;
    let MATH_LIMIT_SECS    = MATH_LIMIT_MINS === 0 ? Infinity : MATH_LIMIT_MINS * 60;
    const db = firebase.firestore();

    // ─── Daily reading prerequisite ───────────────────────────────────────────
    const READ_DATE_KEY  = 'readTimeDate_' + profile.readerId;
    const READ_SECS_KEY  = 'readTimeSecs_' + profile.readerId;

    // ─── Daily math time limit ────────────────────────────────────────────────
    const MATH_DATE_KEY  = 'mathTimeDate_' + profile.readerId;
    const MATH_SECS_KEY  = 'mathTimeSecs_' + profile.readerId;
    const todayStr        = new Date().toISOString().slice(0, 10);

    // Reset both counters on a new day
    if (localStorage.getItem(MATH_DATE_KEY) !== todayStr) {
      localStorage.setItem(MATH_DATE_KEY, todayStr);
      localStorage.setItem(MATH_SECS_KEY, '0');
    }
    if (localStorage.getItem(READ_DATE_KEY) !== todayStr) {
      localStorage.setItem(READ_DATE_KEY, todayStr);
      localStorage.setItem(READ_SECS_KEY, '0');
    }

    const mathSecsToday = parseInt(localStorage.getItem(MATH_SECS_KEY) || '0');
    const readSecsToday = parseInt(localStorage.getItem(READ_SECS_KEY) || '0');
    let mathTimedOut  = MATH_LIMIT_MINS > 0 && mathSecsToday >= MATH_LIMIT_SECS;
    let readingDone   = READ_REQUIRED_MINS === 0 || readSecsToday >= READ_REQUIRED_SECS;

    // ─── Check unlock status then render ──────────────────────────────────────
    // If parent set unlock score to 0, treat as always unlocked
    if (MATH_UNLOCK_SCORE === 0) localStorage.setItem(MATH_UNLOCK_KEY, 'true');

    // Topic filter (e.g. "division") — remembered for this browser session so a child can keep
    // practicing one topic across quizzes.
    let activeTopic = 'all';
    try { activeTopic = sessionStorage.getItem('mathTopicFilter') || 'all'; } catch (e) {}
    let browseOpen = activeTopic !== 'all';
    try { if (sessionStorage.getItem('mathBrowseOpen') === '1') browseOpen = true; } catch (e) {}
    window.toggleMathBrowse = function () {
      browseOpen = !browseOpen;
      try { sessionStorage.setItem('mathBrowseOpen', browseOpen ? '1' : '0'); } catch (e) {}
      if (lastRender) renderPage(...lastRender);
    };
    let lastRender = null;
    window.setMathTopic = function (topic) {
      activeTopic = topic;
      try { sessionStorage.setItem('mathTopicFilter', topic); } catch (e) {}
      if (lastRender) renderPage(...lastRender);
    };

    function renderPage(unlocked, mathProgress, bestReadScore) {
      lastRender = [unlocked, mathProgress, bestReadScore];
      const page = document.getElementById('page-content');

      if (!unlocked) {
        // ── LOCKED: haven't earned 3 stars yet ──────────────────────────────
        const barPct = Math.min(100, (bestReadScore / MATH_UNLOCK_SCORE) * 100);
        let starsHtml = '';
        for (let i = 0; i < 5; i++) starsHtml += i < bestReadScore ? '⭐' : '☆';

        page.innerHTML = `
          <div class="locked-card">
            <div class="lock-icon">🔒</div>
            <div class="locked-title">Math Zone is Locked</div>
            <div class="locked-desc">
              Complete a reading quiz and earn at least <strong>3 stars ⭐⭐⭐</strong>
              to unlock the Math Zone!
            </div>
            <div class="locked-req">📖 Your best reading score: ${bestReadScore}/5 stars</div>
            <div class="best-score-wrap">
              <div class="best-score-label">Progress toward unlock (need 3 stars)</div>
              <div class="best-score-bar-wrap">
                <div class="best-score-bar" style="width:${barPct}%"></div>
              </div>
              <div class="best-score-stars">${starsHtml}</div>
            </div>
            <a href="library.html" class="btn-library">📚 Go Read a Story →</a>
          </div>
        `;
      } else if (!readingDone) {
        // ── READING GATE: need reading before math today ─────────────────────
        const readMinsDone   = Math.floor(readSecsToday / 60);
        const readMinsNeeded = READ_REQUIRED_MINS;
        const barPct = Math.min(100, Math.round((readSecsToday / READ_REQUIRED_SECS) * 100));
        page.innerHTML = `
          <div class="locked-card">
            <div class="lock-icon">📖</div>
            <div class="locked-title">Read First!</div>
            <div class="locked-desc">
              Math Zone opens after <strong>30 minutes of reading</strong> each day.
              You've read <strong>${readMinsDone} min</strong> today — almost there!
            </div>
            <div class="locked-req" style="background:var(--purple)">
              📚 ${readMinsNeeded - readMinsDone} more minute${readMinsNeeded - readMinsDone === 1 ? '' : 's'} of reading to unlock math today!
            </div>
            <div class="best-score-wrap">
              <div class="best-score-label">Today's reading time (need ${readMinsNeeded} min)</div>
              <div class="best-score-bar-wrap">
                <div class="best-score-bar" style="width:${barPct}%;background:var(--purple)"></div>
              </div>
              <div class="best-score-stars" style="font-size:0.9rem;color:var(--muted);">
                ${readMinsDone} / ${readMinsNeeded} minutes
              </div>
            </div>
            <a href="library.html" class="btn-library" style="background:var(--purple)">📚 Go Read a Story →</a>
          </div>
        `;
      } else if (mathTimedOut) {
        // ── DAILY MATH TIME LIMIT REACHED ───────────────────────────────────
        page.innerHTML = `
          <div class="locked-card">
            <div class="lock-icon">📚</div>
            <div class="locked-title">Reading Time!</div>
            <div class="locked-desc">
              You've done <strong>10 minutes of math</strong> today — great work!
              Come back tomorrow for more math after reading.
            </div>
            <div class="locked-req" style="background:var(--purple)">📖 Keep building those reading skills!</div>
            <a href="library.html" class="btn-library" style="background:var(--purple)">📚 Go Read a Story →</a>
          </div>
        `;
      } else {
        // ── UNLOCKED ────────────────────────────────────────────────────────
        const totalMathXp = Object.values(mathProgress).reduce((s, p) => s + (p.xpEarned || 0), 0);
        const MASTERED = 6;   // stars (out of 8) that count as "got it"
        const starsOf  = set => (mathProgress[set.id] && mathProgress[set.id].starsEarned) || 0;
        const isDone   = set => starsOf(set) >= MASTERED;
        const groups   = window.MATH_TOPIC_GROUPS || [];
        const groupIdx = set => { const i = groups.findIndex(g => g.topics.includes(set.topic)); return i < 0 ? 999 : i; };

        // The learning path: fixed practice sets in the order a class would meet the topics
        // (place value → add/subtract → multiply → divide → fractions …), easier (narrower grade range) sets first.
        const PATH = GRADE_MATH_SETS.map((set, i) => ({ set, i })).filter(o => !o.set.dynamic)
          .sort((a, b) => groupIdx(a.set) - groupIdx(b.set) || Math.min(...a.set.grades) - Math.min(...b.set.grades) || a.set.grades.length - b.set.grades.length || a.i - b.i)
          .map(o => o.set);
        const masteredCount = PATH.filter(isDone).length;

        // A weekly focus the parent chose (Parent Portal → Edit child), if this grade has sets for it.
        const focusGroup = groups.find(g => g.id === (profile.mathFocus || ''));
        const inFocus    = set => !!focusGroup && focusGroup.topics.includes(set.topic);
        const focusPath  = focusGroup ? PATH.filter(inFocus) : [];
        const focusExtra = focusGroup ? GRADE_MATH_SETS.filter(set => set.dynamic && inFocus(set)) : [];
        const focusMode  = focusPath.length > 0 || focusExtra.length > 0;

        const nextInFocus = focusMode ? focusPath.find(set => !isDone(set)) : null;
        const nextSet     = nextInFocus || PATH.find(set => !isDone(set));
        const focusFinished = focusMode && !nextInFocus;

        const chip = set => isDone(set) ? '<span class="path-chip done">✓ Got it</span>'
          : mathProgress[set.id] ? `<span class="path-chip some">⭐ ${starsOf(set)}/8</span>`
          : '<span class="path-chip">New</span>';
        const row = (set, isNext) => `<a href="math-quiz.html?set=${set.id}" class="path-row${isNext ? ' next' : ''}">
            <span class="path-emoji">${set.coverEmoji}</span><span class="path-title">${set.title}</span>${set.dynamic ? '<span class="path-chip">🎲 new each time</span>' : chip(set)}</a>`;

        let heroHtml = '';
        if (nextSet) {
          const g = groups[groupIdx(nextSet)];
          const label = nextInFocus ? `⭐ Up next · this week's focus` : (focusFinished ? '⭐ Up next on your path' : '⭐ Up next for you');
          heroHtml = `<div class="up-next">
              <div class="up-label">${label}</div>
              <div class="up-main"><div class="up-emoji">${nextSet.coverEmoji}</div>
                <div><div class="up-title">${nextSet.title}</div>
                <div class="up-meta">${g ? g.label + ' · ' : ''}8 questions${mathProgress[nextSet.id] ? ' · best so far ' + starsOf(nextSet) + '/8' : ''}</div></div></div>
              <a class="up-btn" href="math-quiz.html?set=${nextSet.id}">${mathProgress[nextSet.id] ? 'Keep practicing →' : "Let's go →"}</a>
            </div>`;
        } else if (PATH.length) {
          heroHtml = `<div class="up-done">🎉 You've mastered every practice set for your grade! Pick anything below to keep your skills sharp.</div>`;
        }
        if (focusFinished && nextSet) {
          heroHtml = `<div class="up-done">🎉 You've mastered this week's focus: ${focusGroup.emoji} ${focusGroup.label}!</div>` + heroHtml;
        }

        let guideHtml = '';
        if (focusMode) {
          guideHtml = `<div class="path-section">
              <div class="path-head"><span>📌 This week: ${focusGroup.emoji} ${focusGroup.label}</span><span>${focusPath.filter(isDone).length} of ${focusPath.length} done</span></div>
              ${focusPath.map(set => row(set, set === nextInFocus)).join('')}
              ${focusExtra.map(set => row(set, false)).join('')}
            </div>`;
        } else if (PATH.length) {
          const upcoming = PATH.slice(PATH.indexOf(nextSet) + 1).filter(set => !isDone(set)).slice(0, 3);
          guideHtml = upcoming.length ? `<div class="path-section">
              <div class="path-head"><span>🗺️ Coming up</span><span>${masteredCount} of ${PATH.length} mastered</span></div>
              ${upcoming.map(set => row(set, false)).join('')}
            </div>` : '';
        }

        // Everything else stays available, but tucked away so it isn't the first thing a child sees.
        const topics = [...new Set(GRADE_MATH_SETS.map(s => s.topic))];
        if (activeTopic !== 'all' && !topics.includes(activeTopic)) activeTopic = 'all';
        const visibleSets = activeTopic === 'all' ? GRADE_MATH_SETS : GRADE_MATH_SETS.filter(s => s.topic === activeTopic);
        const pillsHtml = topics.length > 1
          ? '<div class="topic-pills">' + [['all', 'All', GRADE_MATH_SETS.length]]
              .concat(topics.map(t => [t, t.replace(/-/g, ' '), GRADE_MATH_SETS.filter(s => s.topic === t).length]))
              .map(([t, label, n]) => `<button type="button" class="topic-pill${t === activeTopic ? ' active' : ''}" onclick="setMathTopic('${t}')">${label} (${n})</button>`)
              .join('') + '</div>'
          : '';

        const setsHtml = GRADE_MATH_SETS.length === 0
          ? `<div style="text-align:center;padding:48px 16px;color:var(--muted);">
              <div style="font-size:3rem;margin-bottom:16px;">📐</div>
              <div style="font-size:1.1rem;font-weight:700;margin-bottom:8px;">More math topics coming soon!</div>
              <div style="font-size:0.9rem;margin-bottom:20px;">Check back as more grade ${grade} content gets added.</div>
              <a href="library.html" class="btn-library" style="background:var(--purple)">📚 Go Read a Story Instead →</a>
            </div>`
          : `<div class="topic-grid">
              ${visibleSets.map(set => {
                const prog = mathProgress[set.id];
                let starsHtml = '';
                if (prog) {
                  for (let i = 0; i < 8; i++) starsHtml += i < (prog.starsEarned || 0) ? '⭐' : '☆';
                }
                return `<a href="math-quiz.html?set=${set.id}" class="topic-card">
                  <div class="topic-cover" style="background:${set.coverColor}20;">${set.coverEmoji}</div>
                  <div class="topic-body">
                    <span class="topic-label">${set.topic.replace('-', ' ')}</span>
                    <div class="topic-title">${set.title}</div>
                    <div class="topic-meta">${set.dynamic ? '🎲 New questions every time' : '8 questions'}</div>
                    ${prog ? `<div class="topic-stars">${starsHtml} ${prog.starsEarned}/8</div>` : ''}
                    <button class="btn-start ${prog ? 'btn-done' : ''}" onclick="event.preventDefault(); window.location='math-quiz.html?set=${set.id}'">
                      ${prog ? '⭐ Practice Again' : 'Start →'}
                    </button>
                  </div>
                </a>`;
              }).join('')}
            </div>`;
        const browseHtml = GRADE_MATH_SETS.length === 0 ? setsHtml
          : `<button type="button" class="browse-toggle" onclick="toggleMathBrowse()">${browseOpen ? '▲ Hide all topics' : '🔍 Choose a different topic (' + GRADE_MATH_SETS.length + ')'}</button>`
            + (browseOpen ? pillsHtml + setsHtml : '');

        page.innerHTML = `
          <div class="unlocked-header">
            <h1>📐 Math Zone</h1>
            <p>${nextSet ? "Here's what to work on today." : 'Choose a topic and start practicing!'}</p>
            <p style="margin-top:8px;font-size:0.85rem;color:var(--muted);">
              ${MATH_LIMIT_MINS === 0
                ? '⏱️ No daily time limit set'
                : '⏱️ ' + Math.max(0, Math.round((MATH_LIMIT_SECS - mathSecsToday) / 60)) + ' min of math time left today'}
            </p>
          </div>
          ${heroHtml}
          ${guideHtml}
          <div class="total-xp-bar">
            <div>
              <div class="total-xp-num">+${totalMathXp} XP</div>
              <div class="total-xp-label">Math XP earned</div>
            </div>
            <div style="margin-left:auto;font-size:0.9rem;color:var(--muted);">
              ${masteredCount} / ${PATH.length} sets mastered
            </div>
          </div>
          ${browseHtml}
        `;
      }
    }

    // ─── Load data from Firestore ──────────────────────────────────────────────
    let unlocked = localStorage.getItem(MATH_UNLOCK_KEY) === 'true';
    let bestReadScore = 0;
    const mathProgress = {};

    // Always query Firestore to get latest data
    Promise.all([
      // Reading progress (for best score / unlock check)
      db.collection('Progress')
        .where('readerId', '==', profile.readerId)
        .get(),
      // Math progress
      db.collection('MathProgress')
        .where('readerId', '==', profile.readerId)
        .get(),
      // Latest gate settings — the cached copy in localStorage can be stale if a parent
      // changed them since this student last logged in, so always confirm against Firestore.
      profile.profileDocId
        ? db.collection('StudentProfiles').doc(profile.profileDocId).get().catch(() => null)
        : Promise.resolve(null)
    ]).then(([readSnap, mathSnap, profileDoc]) => {
      // Find best reading score
      readSnap.forEach(d => {
        const score = d.data().quizScore || 0;
        if (score > bestReadScore) bestReadScore = score;
      });

      // Refresh gate settings from Firestore if we got them, and recompute derived values
      if (profileDoc && profileDoc.exists) {
        const data = profileDoc.data();
        MATH_UNLOCK_SCORE  = data.mathUnlockScore  ?? MATH_UNLOCK_SCORE;
        READ_REQUIRED_MINS = data.dailyReadMinutes ?? READ_REQUIRED_MINS;
        MATH_LIMIT_MINS    = data.dailyMathMinutes ?? MATH_LIMIT_MINS;
        READ_REQUIRED_SECS = READ_REQUIRED_MINS * 60;
        MATH_LIMIT_SECS    = MATH_LIMIT_MINS === 0 ? Infinity : MATH_LIMIT_MINS * 60;
        mathTimedOut = MATH_LIMIT_MINS > 0 && mathSecsToday >= MATH_LIMIT_SECS;
        readingDone  = READ_REQUIRED_MINS === 0 || readSecsToday >= READ_REQUIRED_SECS;

        profile.mathUnlockScore  = MATH_UNLOCK_SCORE;
        profile.dailyReadMinutes = READ_REQUIRED_MINS;
        profile.dailyMathMinutes = MATH_LIMIT_MINS;
        profile.videosEnabled    = data.videosEnabled !== false;
        profile.mathFocus        = data.mathFocus || '';
        localStorage.setItem('readerProfile', JSON.stringify(profile));
      }

      // Update unlock status
      if (MATH_UNLOCK_SCORE === 0) unlocked = true;
      if (!unlocked && bestReadScore >= MATH_UNLOCK_SCORE) {
        unlocked = true;
      }
      if (unlocked) localStorage.setItem(MATH_UNLOCK_KEY, 'true');

      // Build math progress map (best per set)
      mathSnap.forEach(d => {
        const data = d.data();
        if (!mathProgress[data.setId] || data.starsEarned > mathProgress[data.setId].starsEarned) {
          mathProgress[data.setId] = data;
        }
      });

      renderPage(unlocked, mathProgress, bestReadScore);
    }).catch(() => {
      renderPage(unlocked, mathProgress, 0);
    });

    // Show initial state fast (before Firestore loads)
    renderPage(unlocked, {}, 0);  // reading gate check uses localStorage, no Firestore needed
  </script>
</body>
</html>
