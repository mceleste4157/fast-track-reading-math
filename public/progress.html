<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress – FAST Track Reading & Math</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple: #7c3aed; --purple-soft: #ede9fe;
      --green:  #10b981; --green-soft:  #d1fae5;
      --orange: #f59e0b;
      --blue:   #2563eb;
      --bg: #f8f7ff;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #111827; --muted: #6b7280;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── NAV ── */
    .nav {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 14px 20px; display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 10;
    }
    .nav-back { text-decoration: none; color: var(--purple); font-weight: 600; font-size: 0.9rem; }
    .nav-title { font-weight: 700; font-size: 1rem; flex: 1; text-align: center; color: var(--text); }

    .page { max-width: 560px; margin: 0 auto; padding: 24px 16px 80px; }

    /* ── HERO ── */
    .hero {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 22px;
      display: flex; align-items: center; gap: 16px; margin-bottom: 14px;
    }
    .hero-avatar {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--purple); color: #fff;
      font-size: 1.6rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .hero-name  { font-size: 1.2rem; font-weight: 800; line-height: 1; margin-bottom: 4px; }
    .hero-level { display: inline-flex; align-items: center; gap: 5px; background: var(--purple-soft); color: var(--purple); font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; margin-bottom: 10px; }
    .xp-bar-wrap  { height: 6px; background: #e5e7eb; border-radius: 99px; overflow: hidden; }
    .xp-bar-fill  { height: 100%; background: var(--purple); border-radius: 99px; transition: width 1s; }
    .xp-bar-label { font-size: 0.72rem; color: var(--muted); margin-top: 5px; }

    /* ── STATS STRIP ── */
    .stats-strip {
      display: flex; gap: 10px; margin-bottom: 18px;
    }
    .stat-chip {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 8px; text-align: center;
    }
    .stat-chip-val   { font-size: 1.4rem; font-weight: 800; color: var(--text); line-height: 1; }
    .stat-chip-label { font-size: 0.68rem; font-weight: 600; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.04em; }

    /* ── CARDS ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 12px; overflow: hidden;
    }
    .card-header {
      padding: 14px 18px 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-title { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
    .card-body  { padding: 10px 18px 16px; }

    /* ── STREAK ── */
    .streak-row { display: flex; align-items: center; gap: 16px; padding: 14px 18px; }
    .streak-num { font-size: 2.4rem; font-weight: 900; color: var(--text); line-height: 1; }
    .streak-sub { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
    .streak-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .streak-divider { width: 1px; height: 36px; background: var(--border); flex-shrink: 0; }
    .streak-msg-text { font-size: 0.88rem; font-weight: 600; color: var(--text); flex: 1; }

    /* ── QUEST ROWS ── */
    .quest-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 18px; border-bottom: 1px solid #f3f4f6;
    }
    .quest-row:last-child { border-bottom: none; }
    .quest-emoji { font-size: 1.3rem; flex-shrink: 0; width: 28px; text-align: center; }
    .quest-info  { flex: 1; min-width: 0; }
    .quest-name  { font-size: 0.9rem; font-weight: 700; }
    .quest-desc  { font-size: 0.75rem; color: var(--muted); margin-top: 1px; }
    .quest-bar-wrap { height: 4px; background: #e5e7eb; border-radius: 99px; margin-top: 6px; overflow: hidden; }
    .quest-bar-fill { height: 100%; background: var(--orange); border-radius: 99px; transition: width 0.5s; }
    .quest-bar-fill.done { background: var(--green); }
    .quest-status { flex-shrink: 0; font-size: 0.72rem; font-weight: 700; }
    .quest-status.done     { color: var(--green); }
    .quest-status.progress { color: var(--orange); }
    .quest-status.locked   { color: #d1d5db; }

    /* ── ACTIVITY ROWS ── */
    .act-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 18px; border-bottom: 1px solid #f3f4f6;
    }
    .act-row:last-child { border-bottom: none; }
    .act-emoji { font-size: 1.4rem; flex-shrink: 0; }
    .act-info  { flex: 1; min-width: 0; }
    .act-name  { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .act-meta  { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
    .act-score { flex-shrink: 0; font-size: 0.8rem; font-weight: 700; color: var(--purple); }

    /* ── BADGE CHIPS ── */
    .badge-wrap { padding: 12px 18px 14px; display: flex; flex-wrap: wrap; gap: 8px; }
    .badge-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: #f9fafb; border: 1px solid var(--border);
      border-radius: 99px; padding: 5px 12px; font-size: 0.78rem; font-weight: 700;
    }
    .badge-chip-emoji { font-size: 1rem; }

    /* ── CALENDAR ── */
    .cal-grid   { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; padding: 0 18px 14px; }
    .cal-day-label { font-size: 0.6rem; font-weight: 700; text-align: center; color: var(--muted); text-transform: uppercase; padding: 2px 0 5px; }
    .cal-cell {
      aspect-ratio: 1; border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 600;
    }
    .cal-cell.empty   { background: transparent; }
    .cal-cell.no-read { background: #f3f4f6; color: #d1d5db; }
    .cal-cell.read    { background: var(--green); color: #fff; }
    .cal-cell.today   { outline: 2px solid var(--purple); outline-offset: 1px; }

    /* ── CERT ── */
    .cert-card {
      background: var(--surface); border: 2px solid var(--purple);
      border-radius: var(--radius); padding: 28px 24px; text-align: center; margin-bottom: 14px;
    }

    /* ── EMPTY STATE ── */
    .empty { padding: 28px 18px; text-align: center; color: var(--muted); font-size: 0.88rem; }

    @media print {
      .nav { display: none !important; }
      .cert-card { box-shadow: none !important; }
    }
    @media (max-width: 360px) {
      .stats-strip { gap: 6px; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-back">← Home</a>
    <div class="nav-title" id="nav-title">Progress</div>
  </nav>

  <div class="page">

    <!-- Certificate (shown if grade complete) -->
    <div id="cert-section" style="display:none;"></div>

    <!-- Hero -->
    <div class="hero">
      <div class="hero-avatar" id="hero-avatar">?</div>
      <div style="flex:1;min-width:0;">
        <div class="hero-name" id="hero-name">…</div>
        <div class="hero-level" id="hero-level">📖 Bookworm</div>
        <div class="xp-bar-wrap"><div class="xp-bar-fill" id="xp-bar" style="width:0%"></div></div>
        <div class="xp-bar-label" id="xp-label">Loading…</div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-strip">
      <div class="stat-chip"><div class="stat-chip-val" id="s-stars">⭐ 0</div><div class="stat-chip-label">Stars</div></div>
      <div class="stat-chip"><div class="stat-chip-val" id="s-stories">0</div><div class="stat-chip-label">Stories</div></div>
      <div class="stat-chip"><div class="stat-chip-val" id="s-xp">0</div><div class="stat-chip-label">Total XP</div></div>
      <div class="stat-chip"><div class="stat-chip-val" id="s-math">0</div><div class="stat-chip-label">Math</div></div>
    </div>

    <!-- Streak (shown only if > 0) -->
    <div class="card" id="streak-card" style="display:none;">
      <div class="card-header"><div class="card-title">🔥 Reading Streak</div></div>
      <div class="streak-row">
        <div>
          <div class="streak-label">Current</div>
          <div class="streak-num" id="streak-current">0</div>
          <div class="streak-sub">days in a row</div>
        </div>
        <div class="streak-divider"></div>
        <div>
          <div class="streak-label">Best Ever</div>
          <div class="streak-num" id="streak-longest">0</div>
          <div class="streak-sub">days</div>
        </div>
        <div class="streak-divider"></div>
        <div style="flex:1;"><div class="streak-msg-text" id="streak-msg"></div></div>
      </div>
    </div>

    <!-- Reading Calendar -->
    <div class="card" id="reading-calendar" style="display:none;">
      <div class="card-header">
        <div class="card-title">📅 This Month</div>
        <div style="font-size:0.78rem;font-weight:600;color:var(--purple);" id="cal-month-label"></div>
      </div>
      <div style="padding:8px 0 0;">
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </div>

    <!-- Reading Progress -->
    <div class="card">
      <div class="card-header"><div class="card-title">📖 Reading</div></div>
      <div id="reading-quests"><div class="empty">Loading…</div></div>
    </div>

    <!-- Math Progress -->
    <div class="card">
      <div class="card-header"><div class="card-title">📐 Math</div></div>
      <div id="math-quests"><div class="empty">Loading…</div></div>
    </div>

    <!-- Recent Activity -->
    <div class="card">
      <div class="card-header"><div class="card-title">⚡ Recent Activity</div></div>
      <div id="activity-list"><div class="empty">Loading…</div></div>
    </div>

    <!-- Badges (only earned) -->
    <div class="card" id="badges-section" style="display:none;">
      <div class="card-header"><div class="card-title">🏅 Badges</div></div>
      <div class="badge-wrap" id="badge-grid"></div>
    </div>

  </div><!-- end .page -->

  <script src="stories.js?v=20260607"></script>
  <script src="math-data.js"></script>
  <script src="/__/firebase/10.0.0/firebase-app-compat.js"></script>
  <script src="/__/firebase/10.0.0/firebase-firestore-compat.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script>
    // ─── Profile ────────────────────────────────────────────────────────────────
    const profile = (() => { try { return JSON.parse(localStorage.getItem('readerProfile')); } catch(e) { return null; } })();
    if (!profile) { window.location.href = 'login.html'; }

    document.getElementById('nav-title').textContent = profile.name + '\'s Progress';
    document.getElementById('hero-name').textContent = profile.name;
    const avatarEl = document.getElementById('hero-avatar');
    if (profile.avatarEmoji) {
      avatarEl.textContent = profile.avatarEmoji;
    } else {
      avatarEl.textContent = profile.name.charAt(0).toUpperCase();
    }
    if (profile.avatarColor) avatarEl.style.background = profile.avatarColor;

    const LEVELS = [
      { name: 'Bookworm',     minXp: 0,    emoji: '📖' },
      { name: 'Reader',       minXp: 100,  emoji: '📚' },
      { name: 'Word Hunter',  minXp: 200,  emoji: '🔍' },
      { name: 'Explorer',     minXp: 300,  emoji: '🗺️' },
      { name: 'Thinker',      minXp: 450,  emoji: '🧠' },
      { name: 'Scholar',      minXp: 600,  emoji: '🎓' },
      { name: 'Achiever',     minXp: 800,  emoji: '⚡' },
      { name: 'Champion',     minXp: 1000, emoji: '🏆' },
      { name: 'Super Reader', minXp: 1500, emoji: '🌟' },
      { name: 'Eagle Eye',    minXp: 1850, emoji: '🦅' },
      { name: 'Story Master', minXp: 2200, emoji: '🚀' },
      { name: 'Prodigy',      minXp: 2600, emoji: '💎' },
      { name: 'Summer Hero',  minXp: 3000, emoji: '☀️' },
      { name: 'Grand Master', minXp: 3500, emoji: '👑' },
      { name: 'FAST Legend',  minXp: 4000, emoji: '🌈' },
    ];
    function getLevel(xp) {
      let idx = 0;
      for (let i = 0; i < LEVELS.length; i++) { if (xp >= LEVELS[i].minXp) idx = i; }
      return { level: LEVELS[idx], nextLevel: LEVELS[idx + 1] || null, idx };
    }
    function formatDate(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // ─── Quest row renderer ──────────────────────────────────────────────────────
    function questRow(emoji, name, desc, status, current, target) {
      const isDone  = status === 'done';
      const hasBar  = target != null && !isDone;
      const pct     = target ? Math.min(100, Math.round((current / target) * 100)) : 0;
      const statusText = isDone ? '✓ Done' : (target ? current + '/' + target : '');
      const statusCls  = isDone ? 'done' : (status === 'locked' ? 'locked' : 'progress');
      return `<div class="quest-row">
        <div class="quest-emoji">${emoji}</div>
        <div class="quest-info">
          <div class="quest-name">${name}</div>
          <div class="quest-desc">${desc}</div>
          ${hasBar ? `<div class="quest-bar-wrap"><div class="quest-bar-fill${isDone?' done':''}" style="width:${pct}%"></div></div>` : ''}
        </div>
        <div class="quest-status ${statusCls}">${statusText}</div>
      </div>`;
    }

    // ─── Badges ─────────────────────────────────────────────────────────────────
    const BADGES = [
      { id: 'first_story',   emoji: '📖', name: 'First Story'    },
      { id: 'story_5',       emoji: '📚', name: 'Bookworm'       },
      { id: 'story_10',      emoji: '🌟', name: 'Story Chaser'   },
      { id: 'story_20',      emoji: '🏆', name: 'Story Champion' },
      { id: 'perfect_score', emoji: '💯', name: 'Perfect Score'  },
      { id: 'math_unlock',   emoji: '🔓', name: 'Math Explorer'  },
      { id: 'math_first',    emoji: '🔢', name: 'Math Starter'   },
      { id: 'math_5',        emoji: '📐', name: 'Math Master'    },
      { id: 'streak_3',      emoji: '🔥', name: '3-Day Streak'   },
      { id: 'streak_7',      emoji: '⚡', name: 'Week Warrior'   },
      { id: 'streak_14',     emoji: '🌙', name: 'Two-Week Champ' },
      { id: 'xp_500',        emoji: '💎', name: 'XP Hunter'      },
      { id: 'typing_first',  emoji: '⌨️', name: 'Keyboarder'     },
      { id: 'typing_5',      emoji: '🖥️', name: 'Typing Pro'     },
      { id: 'typing_10',     emoji: '⚡', name: 'Speed Demon'    },
    ];

    // ─── Load data ───────────────────────────────────────────────────────────────
    const db = firebase.firestore();
    Promise.all([
      db.collection('Progress').where('readerId', '==', profile.readerId).get(),
      db.collection('MathProgress').where('readerId', '==', profile.readerId).get(),
      db.collection('TypingProgress').where('readerId', '==', profile.readerId).get(),
      db.collection('TriviaScores').where('readerId', '==', profile.readerId).get(),
      db.collection('StudentStats').doc(profile.readerId).get()
    ]).then(([readSnap, mathSnap, typingSnap, triviaSnap, statsSnap]) => {

      // ── Reading aggregates ────────────────────────────────────────────────
      let readXp = 0, bestReadScore = 0;
      const uniqueStories = new Set();
      const topicsSeen    = new Set();
      const readDocs      = [];
      const bestPerStory  = {};

      readSnap.forEach(d => {
        const data = d.data();
        readXp += (data.xpEarned || 0);
        if ((data.quizScore || 0) > bestReadScore) bestReadScore = data.quizScore;
        uniqueStories.add(data.storyId);
        if (data.storyTopic) topicsSeen.add(data.storyTopic);
        readDocs.push(data);
        if (!bestPerStory[data.storyId] ||
            (data.quizScore || 0) > (bestPerStory[data.storyId].quizScore || 0)) {
          bestPerStory[data.storyId] = data;
        }
      });

      const bestReadArr   = Object.values(bestPerStory);
      const readStars     = bestReadArr.reduce((s, d) => s + (d.starsEarned || 0), 0);
      const perfectScores = bestReadArr.filter(d => (d.quizScore || 0) >= (d.quizTotal || 5)).length;

      // ── Math aggregates ───────────────────────────────────────────────────
      let mathXp = 0;
      const uniqueMath   = new Set();
      const mathPerfects = new Set();
      const mathDocs     = [];

      mathSnap.forEach(d => {
        const data = d.data();
        mathXp += (data.xpEarned || 0);
        uniqueMath.add(data.setId);
        if (data.perfectFirstTry && data.quizScore === data.quizTotal) mathPerfects.add(data.setId);
        mathDocs.push(data);
      });

      let typingXp = 0;
      const typingDocs = [];
      typingSnap.forEach(d => {
        const data = d.data();
        typingXp += (data.xpEarned || 0);
        typingDocs.push(data);
      });

      let triviaXp = 0;
      const triviaDocs = [];
      triviaSnap.forEach(d => {
        const data = d.data();
        triviaXp += (data.xpEarned || 0);
        triviaDocs.push(data);
      });

      const totalXp      = readXp + mathXp + typingXp + triviaXp;
      const storiesCount = uniqueStories.size;
      const mathCount    = uniqueMath.size;
      const mathUnlocked = bestReadScore >= 3 || localStorage.getItem('mathUnlocked_' + profile.readerId) === 'true';
      if (mathUnlocked) localStorage.setItem('mathUnlocked_' + profile.readerId, 'true');

      // ── Stats ─────────────────────────────────────────────────────────────
      document.getElementById('s-stars').textContent   = '⭐ ' + readStars;
      document.getElementById('s-stories').textContent = storiesCount;
      document.getElementById('s-xp').textContent      = totalXp;
      document.getElementById('s-math').textContent    = mathCount + '/' + MATH_SETS.length;

      // ── Level bar ─────────────────────────────────────────────────────────
      const { level, nextLevel } = getLevel(totalXp);
      document.getElementById('hero-level').textContent = level.emoji + ' ' + level.name;
      if (nextLevel) {
        const pct = Math.min(100, ((totalXp - level.minXp) / (nextLevel.minXp - level.minXp)) * 100);
        document.getElementById('xp-bar').style.width = pct + '%';
        document.getElementById('xp-label').textContent =
          totalXp + ' XP · ' + (nextLevel.minXp - totalXp) + ' more to ' + nextLevel.emoji + ' ' + nextLevel.name;
      } else {
        document.getElementById('xp-bar').style.width = '100%';
        document.getElementById('xp-label').textContent = '🌈 FAST Legend! ' + totalXp + ' XP';
      }

      // ── Streak ────────────────────────────────────────────────────────────
      const sd = statsSnap.exists ? statsSnap.data() : {};
      const currentStreak = sd.currentStreak || 0;
      const longestStreak = sd.longestStreak || 0;
      if (currentStreak > 0 || longestStreak > 0) {
        document.getElementById('streak-current').textContent = currentStreak;
        document.getElementById('streak-longest').textContent = longestStreak;
        const f = currentStreak >= 14 ? '🌙🔥 ' : currentStreak >= 7 ? '⚡🔥 ' : currentStreak >= 3 ? '🔥 ' : '';
        document.getElementById('streak-msg').textContent = currentStreak > 0
          ? f + currentStreak + '-day streak — keep it up!'
          : 'Read every day to build your streak!';
        document.getElementById('streak-card').style.display = 'block';
      }

      // ── Badges (earned only) ──────────────────────────────────────────────
      const earnedBadges = new Set(sd.badges || []);
      const badgeGrid    = document.getElementById('badge-grid');
      let earnedCount    = 0;
      BADGES.forEach(b => {
        if (!earnedBadges.has(b.id)) return;
        earnedCount++;
        const chip = document.createElement('div');
        chip.className = 'badge-chip';
        chip.innerHTML = `<span class="badge-chip-emoji">${b.emoji}</span>${b.name}`;
        badgeGrid.appendChild(chip);
      });
      document.getElementById('badges-section').style.display = earnedCount > 0 ? 'block' : 'none';

      // ── Reading Quests ────────────────────────────────────────────────────
      document.getElementById('reading-quests').innerHTML = [
        questRow('📖', 'First Story', 'Read any story from the library',
          storiesCount >= 1 ? 'done' : 'locked', null, null),
        questRow('📚', 'Story Collector', 'Read 5 different stories',
          storiesCount >= 5 ? 'done' : storiesCount > 0 ? 'in-progress' : 'locked',
          storiesCount, 5),
        questRow('🌟', 'Story Explorer', 'Read 20 stories',
          storiesCount >= 20 ? 'done' : storiesCount > 0 ? 'in-progress' : 'locked',
          storiesCount, 20),
        questRow('⭐', 'Perfect Score', 'Get all 5 questions right on a quiz',
          perfectScores >= 1 ? 'done' : 'locked', null, null),
        questRow('🏆', 'Triple Perfect', 'Earn 3 perfect quiz scores',
          perfectScores >= 3 ? 'done' : perfectScores > 0 ? 'in-progress' : 'locked',
          perfectScores, 3),
        questRow('🎨', 'Topic Explorer', 'Read stories from 3 different topics',
          topicsSeen.size >= 3 ? 'done' : topicsSeen.size > 0 ? 'in-progress' : 'locked',
          topicsSeen.size, 3),
      ].join('');

      // ── Math Quests ───────────────────────────────────────────────────────
      document.getElementById('math-quests').innerHTML = [
        questRow('🔓', 'Unlock Math Zone', 'Earn 3 stars on a reading quiz',
          mathUnlocked ? 'done' : 'locked', null, null),
        questRow('🧮', 'Math Starter', 'Complete your first math topic',
          mathCount >= 1 ? 'done' : mathUnlocked ? 'in-progress' : 'locked', null, null),
        questRow('📐', 'Math Expert', 'Complete all ' + MATH_SETS.length + ' math topics',
          mathCount >= MATH_SETS.length ? 'done' : mathCount > 0 ? 'in-progress' : 'locked',
          mathCount, MATH_SETS.length),
        questRow('⭐', 'Math Perfect', 'Get all 8 right on any math topic',
          mathPerfects.size >= 1 ? 'done' : 'locked', null, null),
      ].join('');

      // ── Recent Activity ───────────────────────────────────────────────────
      const storyMap = {};
      STORIES.forEach(s => { storyMap[s.id] = s; });
      const mathMap = {};
      MATH_SETS.forEach(s => { mathMap[s.id] = s; });

      const allActivity = [
        ...readDocs.map(d => ({
          ts: d.completedAt,
          emoji: (storyMap[d.storyId] || {}).coverEmoji || '📖',
          name:  d.storyTitle || d.storyId,
          meta:  formatDate(d.completedAt),
          score: d.quizScore === 5 ? '🏆 Perfect' : d.quizScore + '/5'
        })),
        ...mathDocs.map(d => ({
          ts: d.completedAt,
          emoji: (mathMap[d.setId] || {}).coverEmoji || '📐',
          name:  d.setTitle || d.setId,
          meta:  formatDate(d.completedAt),
          score: d.quizScore === 8 ? '🏆 Perfect' : d.quizScore + '/8'
        })),
        ...typingDocs.map(d => ({
          ts:    d.completedAt,
          emoji: '⌨️',
          name:  d.lessonTitle || d.lessonId || 'Typing Lesson',
          meta:  formatDate(d.completedAt),
          score: (d.wpm || 0) + ' WPM'
        })),
        ...triviaDocs.map(d => ({
          ts:    d.timestamp,
          emoji: '🎯',
          name:  'Story Trivia',
          meta:  formatDate(d.timestamp),
          score: (d.correctAnswers || 0) + '/' + (d.totalQuestions || 15) + ' correct'
        }))
      ].sort((a, b) => {
        const ta = a.ts && a.ts.toMillis ? a.ts.toMillis() : 0;
        const tb = b.ts && b.ts.toMillis ? b.ts.toMillis() : 0;
        return tb - ta;
      }).slice(0, 6);

      const actEl = document.getElementById('activity-list');
      actEl.innerHTML = allActivity.length === 0
        ? '<div class="empty">No activity yet — go read a story!</div>'
        : allActivity.map(a => `
          <div class="act-row">
            <div class="act-emoji">${a.emoji}</div>
            <div class="act-info">
              <div class="act-name">${a.name}</div>
              <div class="act-meta">${a.meta}</div>
            </div>
            <div class="act-score">${a.score}</div>
          </div>`).join('');

      // ── Grade completion certificate ──────────────────────────────────────
      const grade = parseInt(profile.gradeLevel) || 4;
      const gradeStories = (typeof STORIES !== 'undefined') ? STORIES.filter(s => {
        if (!Array.isArray(s.grades) || !s.grades.includes(grade)) return false;
        const gl = String(s.gradeLevel || '');
        if (gl.includes('-')) { const [lo,hi]=gl.split('-').map(Number); return grade>=lo&&grade<=hi; }
        return parseInt(gl) === grade;
      }) : [];
      const completedIds = new Set(Object.keys(bestPerStory || {}));
      const allDone = gradeStories.length > 0 && gradeStories.every(s => completedIds.has(s.id));
      if (allDone) {
        const certSection = document.getElementById('cert-section');
        certSection.style.display = 'block';
        const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        certSection.innerHTML = `<div class="cert-card">
          <div style="font-size:2.5rem;margin-bottom:10px;">🏆</div>
          <div style="font-size:0.72rem;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:var(--purple);margin-bottom:8px;">Certificate of Achievement</div>
          <div style="font-size:1.4rem;font-weight:800;margin-bottom:4px;">${profile.name || 'Student'}</div>
          <div style="font-size:0.88rem;color:var(--muted);margin-bottom:4px;">completed all Grade ${grade} stories in</div>
          <div style="font-size:1.05rem;font-weight:800;color:var(--purple);margin-bottom:14px;">FAST Track Reading & Math</div>
          <div style="font-size:0.8rem;color:var(--muted);margin-bottom:18px;">${today}</div>
          <button onclick="window.print()" style="padding:10px 22px;background:var(--purple);color:#fff;border:none;border-radius:10px;font-size:0.9rem;font-weight:700;cursor:pointer;font-family:inherit;">🖨️ Print Certificate</button>
        </div>`;
      }

      // ── Reading calendar ──────────────────────────────────────────────────
      (function buildCalendar() {
        const calEl = document.getElementById('reading-calendar');
        const grid  = document.getElementById('cal-grid');
        if (!calEl || !grid) return;

        const now   = new Date();
        const year  = now.getFullYear();
        const month = now.getMonth();
        document.getElementById('cal-month-label').textContent =
          now.toLocaleDateString('en-US', { month: 'long' });

        function renderCalendar(activityDocs) {
          const readDates = new Set();
          activityDocs.forEach(doc => {
            const d = doc.data();
            if (d.type === 'story' && d.date) {
              const [y, m] = d.date.split('-').map(Number);
              if (y === year && m - 1 === month) readDates.add(d.date);
            }
          });

          const firstDay  = new Date(year, month, 1).getDay();
          const daysInMon = new Date(year, month + 1, 0).getDate();
          const todayStr  = now.toISOString().slice(0, 10);
          const DAY_LABELS = ['S','M','T','W','T','F','S'];
          let html = DAY_LABELS.map(d => `<div class="cal-day-label">${d}</div>`).join('');
          for (let i = 0; i < firstDay; i++) html += `<div class="cal-cell empty"></div>`;
          for (let d = 1; d <= daysInMon; d++) {
            const dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
            const isRead  = readDates.has(dateStr);
            const isToday = dateStr === todayStr;
            html += `<div class="cal-cell ${isRead ? 'read' : 'no-read'}${isToday ? ' today' : ''}">${d}</div>`;
          }
          grid.innerHTML = html;
          calEl.style.display = 'block';
        }

        renderCalendar([]);
        db.collection('StudentActivity').where('readerId', '==', profile.readerId).get()
          .then(snap => renderCalendar(snap.docs))
          .catch(() => {});
      })();

    }).catch(err => {
      console.error('Progress board error:', err);
      ['reading-quests','math-quests','activity-list'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = '<div class="empty" style="color:#dc2626">⚠️ Could not load — check connection.</div>';
      });
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(()=>{});
      navigator.serviceWorker.addEventListener('message', e => {
        if (e.data && e.data.type === 'SW_UPDATED') setTimeout(() => window.location.reload(), 500);
      });
    }
  </script>
</body>
</html>
